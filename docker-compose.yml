services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set in .env for docker build}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set in .env for docker build}
        # Web Push: must be present at image build time (inlined into the browser bundle).
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    ports:
      - "3000:3000"
    env_file:
      - .env
      # Next.js dev often uses `.env.local`; Compose only loaded `.env` before, so DO_* here were invisible in the container.
      - path: .env.local
        required: false
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(\"http://127.0.0.1:\"+(process.env.PORT||3000)).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - node_modules/
            - .next/
            - .git/
            - supabase/
            - docker/
            - docs/
            - "*.md"
            - .env
            - .env.*

  cron:
    build:
      context: ./docker/cron
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      CRON_BASE_URL: http://web:3000
      TZ: ${TZ:-UTC}
    volumes:
      - ./vercel.json:/config/vercel.json:ro
    depends_on:
      web:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - node_modules/
            - .next/
            - .git/
            - supabase/
            - docker/
            - docs/
            - "*.md"
            - .env
            - .env.*

